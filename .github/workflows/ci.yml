name: CI

# Runs on every push and PR to catch:
#   1. i18n regressions — malformed markers, missing keys, dict asymmetry
#   2. plugin unit-test failures
#   3. build breakage on either EN or BG output
#
# Deliberately independent from deploy.yml (which only runs on push to main
# and does the pages deploy) so a PR from a fork still gets the full check
# suite without needing pages-write permissions.

on:
  push:
    # Run on every branch push — a feature branch that stays red between
    # PR-open events wastes reviewer time. The concurrency group below
    # cancels stale runs on the same ref so a flurry of commits doesn't
    # queue up.
    branches: ['**']
    # Skip runs on docs-only pushes. Files listed here don't affect
    # runtime code, the i18n bundles, or CI configuration, so a build
    # + test pass is pure noise/cost. If a doc change reveals a subtle
    # code issue, the next code push runs full CI anyway.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.obsidian/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.obsidian/**'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  # Cancel in-flight CI on the same ref when a newer commit lands — a stale
  # run is never more useful than a fresh one. Workflow-scoped so a future
  # additional workflow can't accidentally collide on this group name (L5).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pinned rather than `ubuntu-latest` so a GitHub-driven bump can't
    # silently change the Node/npm/glibc versions under CI. Bump
    # intentionally when a newer LTS is available.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Lint FIRST — dict/marker issues are the cheapest to reproduce
      # locally and give the clearest error message, so surfacing them
      # before test/build failures makes the PR feedback loop cleaner.
      - name: Validate i18n dictionaries + markers
        run: npm run i18n:lint

      - name: Run unit tests
        run: npm test

      # Full build both locales so a template that breaks mid-transform
      # (e.g. a malformed sanitizer input the load-time checks can't catch)
      # still fails CI rather than shipping later at deploy time.
      - name: Build site
        run: npm run build
